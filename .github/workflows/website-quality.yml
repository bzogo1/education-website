name: Website Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run MegaLinter
        uses: oxsecurity/megalinter@v10.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          REPOSITORY_DEVSKIM_FORWARD_EXCLUDED_DIRECTORIES: false

  browser-tests:
    name: Browser and accessibility tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Update npm
        run: npm install --global npm@12.2.1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build and test every page
        run: npm run test:e2e

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Update npm
        run: npm install --global npm@12.2.1

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Audit representative page templates
        uses: treosh/lighthouse-ci-action@12.6.2
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

  links:
    name: Broken-link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Update npm
        run: npm install --global npm@12.2.1

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Check links in generated pages
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --verbose --no-progress --root-dir ${{ github.workspace }}/dist --exclude '^https://tailcast\.vercel\.app/' './dist/**/*.html'
