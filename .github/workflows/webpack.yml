name: Astro site build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
