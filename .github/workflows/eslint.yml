name: ESLint

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  eslint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Update npm
        run: npm install --global npm@12.2.1

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Generate ESLint SARIF report
        if: always()
        run: npm run lint -- --format @microsoft/eslint-formatter-sarif --output-file eslint-results.sarif

      - name: Upload ESLint SARIF report
        if: always() && hashFiles('eslint-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-results.sarif
