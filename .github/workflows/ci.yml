name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Astro Check
        uses: radenpioneer/astro-check@v0.1.2
        with:
          check-command: check
          node-version: 22.23.4
          package-manager: npm
