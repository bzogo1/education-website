name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Update npm
        run: npm install --global npm@12.2.1

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
