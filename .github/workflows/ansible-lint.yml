name: Ansible Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ansible-lint:
    name: run-ansible-lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect Ansible content
        id: ansible-content
        run: |
          if git ls-files | grep -Eq '(^|/)(ansible\.cfg|playbook[^/]*\.ya?ml|site\.ya?ml)$|(^|/)(ansible|playbooks|roles)/.*\.ya?ml$'; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: run-ansible-lint
        if: steps.ansible-content.outputs.found == 'true'
        uses: ansible/ansible-lint@v26.10.1
        with:
          args: --offline
